[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepagent"
version = "0.1.0"
description = "A deep coding agent for Kali Linux: Claude/Codex-class tool loop over NVIDIA NIM, OpenAI-compatible, Ollama, llama.cpp or Anthropic models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "prompt_toolkit>=3.0.43",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
web = ["beautifulsoup4>=4.12", "markdownify>=0.12"]
all = ["beautifulsoup4>=4.12", "markdownify>=0.12", "tiktoken>=0.7"]

[project.scripts]
deepagent = "deepagent.cli:main"
dag = "deepagent.cli:main"

[tool.setuptools.packages.find]
include = ["deepagent*"]
